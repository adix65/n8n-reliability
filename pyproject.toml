[project]
name = "n8n-reliability"
version = "0.1.0"
description = "Static reliability analysis of publicly available n8n workflow exports"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
llm-annotator = ["anthropic>=0.40"]

[project.scripts]
n8n-reliability = "n8n_reliability.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["n8n_reliability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
